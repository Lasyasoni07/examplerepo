{% extends 'base.html' %}

{% block content %}
<h2>Welcome, {{ username }}!</h2>
<h3>Select a User to Chat With:</h3>
<ul>
    {% for user in users %}
        <li><a href="{{ url_for('chat.chat_with_user', recipient_id=user.id) }}">{{ user.username }}</a></li>
    {% endfor %}
</ul>
<a href="{{ url_for('auth.logout') }}">Logout</a>
{% endblock %}
