{% extends "base.html" %}
{% block title %}TODO List{% endblock %}
{% block content %}
<h3>TODO List</h3>
<form id="addTodoForm">
    <div class="form-group">
        <input type="text" id="taskInput" class="form-control" placeholder="Enter new task">
    </div>
    <button type="submit" class="btn btn-primary">Add Task</button>
</form>

<ul id="todoList" class="list-group mt-3"></ul>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert('Please log in to access this page.');
            window.location.href = '/login';
            return;
        }
        
        verifyToken(token)
            .then(isValid => {
                if (isValid) {
                    fetchTodos();
                    document.getElementById('addTodoForm').addEventListener('submit', function(e) {
                        e.preventDefault();
                        addTodo();
                    });
                } else {
                    alert('Session expired. Please log in again.');
                    localStorage.removeItem('access_token');
                    window.location.href = '/login';
                }
            })
            .catch(error => {
                console.error('Error verifying token:', error);
                alert('An error occurred. Please log in again.');
                localStorage.removeItem('access_token');
                window.location.href = '/login';
            });
    });

    function verifyToken(token) {
        return fetch('/verify-token', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            }
        })
        .then(response => response.json())
        .then(data => data.valid)
        .catch(() => false);
    }

    function fetchTodos() {
        const token = localStorage.getItem('access_token');
        fetch('/todo', {
            headers: {
                'Authorization': 'Bearer ' + token
            }
        })
        .then(response => {
            if (!response.ok) {
                if (response.status === 401) {
                    alert('Session expired. Please log in again.');
                    localStorage.removeItem('access_token');
                    window.location.href = '/login';
                }
                throw new Error('Failed to fetch todos');
            }
            return response.json();
        })
        .then(data => {
            const todoList = document.getElementById('todoList');
            todoList.innerHTML = '';
            data.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.innerHTML = `
                    <div class="d-flex align-items-center">
                        <input type="checkbox" class="mr-2" ${todo.completed ? 'checked' : ''} onchange="updateTodoStatus(${todo.id}, this.checked)">
                        <span class="flex-grow-1 ${todo.completed ? 'text-muted text-decoration-line-through' : ''}">${todo.task}</span>
                        <button class="btn btn-danger btn-sm" onclick="deleteTodo(${todo.id})">Delete</button>
                    </div>
                `;
                todoList.appendChild(li);
            });
        })
        .catch(error => {
            console.error('Error fetching todos:', error);
            alert(error.message || 'Failed to fetch todos');
        });
    }

    function addTodo() {
        const taskInput = document.getElementById('taskInput');
        const task = taskInput.value.trim();
        if (!task) return;
    
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert('No access token found. Please log in.');
            window.location.href = '/login';
            return;
        }
    
        fetch('/todo', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ task: task })
        })
        .then(response => {
            if (!response.ok) {
                // Capture error message from server
                return response.json().then(data => {
                    throw new Error(data.message || 'Failed to add todo');
                });
            }
            return response.json();
        })
        .then(() => {
            taskInput.value = '';
            fetchTodos();
        })
        .catch(error => {
            console.error('Error adding todo:', error);
            alert(error.message || 'Failed to add todo');
        });
    }

    function deleteTodo(id) {
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert('Please log in to perform this action.');
            window.location.href = '/login';
            return;
        }

        fetch(`/todo/${id}`, {
            method: 'DELETE',
            headers: {
                'Authorization': 'Bearer ' + token
            }
        })
        .then(response => {
            if (!response.ok) {
                if (response.status === 401) {
                    alert('Session expired. Please log in again.');
                    localStorage.removeItem('access_token');
                    window.location.href = '/login';
                }
                throw new Error('Failed to delete todo');
            }
            return response.json();
        })
        .then(data => {
            alert(data.message || 'Todo deleted successfully');
            fetchTodos(); 
        })
        .catch(error => {
            console.error('Error deleting todo:', error);
            alert(error.message || 'Failed to delete todo');
        });
    }

    function updateTodoStatus(id, completed) {
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert('Please log in to perform this action.');
            window.location.href = '/login';
            return;
        }
    
        fetch(`/todo/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ completed: completed })
        })
        .then(response => {
            if (!response.ok) {
                if (response.status === 401) {
                    alert('Session expired. Please log in again.');
                    localStorage.removeItem('access_token');
                    window.location.href = '/login';
                }
                throw new Error('Failed to update todo status');
            }
            return response.json();
        })
        .then(data => {
            console.log(data.message || 'Todo updated successfully');
        })
        .catch(error => {
            console.error('Error updating todo:', error);
            alert(error.message || 'Failed to update todo');
        });
    }
    
</script>
{% endblock %}
